name: Build & Release Rosetta

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (x64)
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
      ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run TypeScript Check
        run: pnpm run typecheck

      - name: Compile & Build Application
        run: pnpm run build

      - name: Build Windows Executables (NSIS & Portable)
        run: pnpm exec electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rosetta-Windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

      - name: Extract Project Version
        id: get_version
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          "VERSION=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.get_version.outputs.VERSION }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Rosetta {0}', steps.get_version.outputs.VERSION) }}
          files: |
            dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
